[project]
name = "eti"
version = "0.1.0"
description = "Emerging Technology Intelligence — evidence-first платформа раннего обнаружения научно-технологических трендов"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "python-dateutil>=2.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.optional-dependencies]
nlp = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "hdbscan>=0.8.40",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.7",
]
orchestration = [
    "prefect>=3.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eti"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
packages = ["eti"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
